<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514" />
      <stop offset="50%" stop-color="#140b2b" />
      <stop offset="100%" stop-color="#061826" />
    </linearGradient>
    <radialGradient id="chronoSphere" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)" />
  <circle cx="600" cy="337" r="280" fill="url(#chronoSphere)" />

  <!-- Time distortion rings -->
  <g stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.4">
    <circle cx="600" cy="337" r="80" stroke-dasharray="8 4" />
    <circle cx="600" cy="337" r="160" stroke-dasharray="12 6" />
    <circle cx="600" cy="337" r="240" stroke-dasharray="4 8" />
  </g>

  <g font-family="monospace" fill="#e2e8f0">
    <text x="60" y="80" font-size="22" font-weight="bold" fill="#38bdf8" letter-spacing="4">AETHERIA: CHRONO VEIL</text>
    <text x="60" y="115" font-size="14" fill="#94a3b8">TIME-DILATION COMBAT ENGINE // CUSTOM HLSL WAVE SHADER</text>
    <text x="1140" y="80" font-size="14" text-anchor="end" fill="#a855f7">DELTA TIME [T-LOCAL]: 0.15x</text>
    <text x="1140" y="115" font-size="13" text-anchor="end" fill="#64748b">OBJECT POOLING: 1024 PARTICLES</text>
  </g>
</svg>
