<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="puzzleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#puzzleBg)" />
  <rect width="1200" height="675" fill="url(#purpleGlow)" />
  
  <!-- Fuse Box / Electrical Puzzle Nodes -->
  <g stroke="#a855f7" stroke-width="2" fill="#3b0764">
    <circle cx="450" cy="250" r="28" />
    <circle cx="600" cy="250" r="28" fill="#10b981" stroke="#34d399" />
    <circle cx="750" cy="250" r="28" />
    <circle cx="450" cy="400" r="28" fill="#10b981" stroke="#34d399" />
    <circle cx="600" cy="400" r="28" />
    <circle cx="750" cy="400" r="28" fill="#10b981" stroke="#34d399" />
    
    <!-- Wire connections -->
    <path d="M450,250 Q525,200 600,250" fill="none" stroke="#34d399" stroke-width="3" />
    <path d="M600,250 Q675,325 600,400" fill="none" stroke="#ec4899" stroke-width="3" stroke-dasharray="8,4" />
    <path d="M450,400 Q600,470 750,400" fill="none" stroke="#34d399" stroke-width="3" />
  </g>

  <g font-family="monospace" fill="#f3e8ff">
    <text x="50" y="70" font-size="18" font-weight="bold" fill="#c084fc">CIRCUIT BREAKER PUZZLE // LOGIC STATE</text>
    <text x="50" y="95" font-size="12" fill="#a855f7">CIRCUIT COMPLETION: 75% • POWER RESTORATION</text>
  </g>
</svg>
