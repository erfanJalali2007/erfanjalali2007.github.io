<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#19070e" />
    </linearGradient>
    <radialGradient id="flashlight" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bloodGlow" cx="80%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)" />
  <rect width="1200" height="675" fill="url(#flashlight)" />
  <rect width="1200" height="675" fill="url(#bloodGlow)" />
  
  <!-- Hospital Hallway Perspective Grid -->
  <g stroke="#334155" stroke-opacity="0.3" stroke-width="1.5">
    <line x1="0" y1="120" x2="480" y2="337" />
    <line x1="0" y1="555" x2="480" y2="337" />
    <line x1="1200" y1="120" x2="720" y2="337" />
    <line x1="1200" y1="555" x2="720" y2="337" />
    <line x1="480" y1="260" x2="720" y2="260" />
    <line x1="480" y1="414" x2="720" y2="414" />
    <line x1="480" y1="260" x2="480" y2="414" />
    <line x1="720" y1="260" x2="720" y2="414" />
  </g>

  <!-- Survival Horror HUD Overlay -->
  <g font-family="monospace" fill="#94a3b8">
    <text x="60" y="80" font-size="22" font-weight="bold" fill="#f43f5e" letter-spacing="4">SYSTEM: UNITY URP // FORSAKEN HOSPITAL</text>
    <text x="60" y="115" font-size="14" fill="#64748b">MODULE: PROCEDURAL RAYCAST INTERACTION &amp; FLASHLIGHT</text>
    <rect x="60" y="580" width="180" height="8" rx="4" fill="#334155" />
    <rect x="60" y="580" width="135" height="8" rx="4" fill="#10b981" />
    <text x="60" y="610" font-size="12" fill="#64748b">BATTERY POWER: 75% [STABLE]</text>
    <text x="960" y="610" font-size="13" text-anchor="end" fill="#f43f5e">FPS: 144 // GC ALLOC: 0.0 KB</text>
  </g>

  <!-- Crosshair Focus -->
  <circle cx="600" cy="337" r="18" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />
  <circle cx="600" cy="337" r="2" fill="#f43f5e" />
</svg>
