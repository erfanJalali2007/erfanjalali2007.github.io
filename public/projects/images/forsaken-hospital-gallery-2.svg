      <stop offset="0%" stop-color="#050505" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <radialGradient id="amberGlow" cx="65%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#invBg)" />
  <rect width="1200" height="675" fill="url(#amberGlow)" />
  
  <!-- Inventory Grid UI Mockup -->
  <g stroke="#78350f" stroke-width="1.5" fill="#292524" fill-opacity="0.6">
