    <rect x="440" y="160" width="100" height="100" rx="8" />
    <rect x="200" y="280" width="100" height="100" rx="8" />
    <rect x="320" y="280" width="100" height="100" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="2" />
    <rect x="440" y="280" width="100" height="100" rx="8" />
