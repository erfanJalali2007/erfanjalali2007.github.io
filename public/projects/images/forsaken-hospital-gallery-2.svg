  <!-- 3D Item Inspection Wireframe -->
  <circle cx="850" cy="320" r="140" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,6" />
  <polygon points="850,220 930,270 930,370 850,420 770,370 770,270" fill="#78350f" fill-opacity="0.3" stroke="#fbbf24" stroke-width="2" />

  <g font-family="monospace" fill="#fde68a">
